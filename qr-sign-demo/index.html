<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Sign Picker Demo</title>
<style>
  :root { --ink: #1F1B16; --muted: #6B6258; --line: #E6DFD4; --bg: #F7F3EC; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  input { font: inherit; padding: 9px 11px; border: 1px solid #D5CCBE; border-radius: 8px; }
  .card { margin-top: 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .card img { width: 140px; height: 140px; }
  .more { all: unset; cursor: pointer; color: #8B1E3F; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2147483600; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); display: none; }
</style>
</head>
<body>
<main>
  <h1>Event QR code</h1>
  <p class="lead">Demo of the "See more designs" picker. Change the details and open the picker.</p>
  <form id="f">
    <label>Event name <input name="eventName" value="Ayush &amp; Netali" required></label>
    <label>Studio name <input name="studioName" value="Nisha Studios" required></label>
    <label>Event date (optional) <input name="eventDate" type="date" value="2026-11-05"></label>
    <label>Studio phone (optional) <input name="studioPhone" value="+91 98765 43210"></label>
    <label>Instagram (optional) <input name="studioInstagram" value="nishastudios"></label>
    <label>Link in the QR <input name="qrUrl" value="https://media.celebrare.in/s/AbC123xYz"></label>
  </form>
  <div class="card">
    <img id="plainQr" alt="Plain QR code">
    <div>
      <div style="font-weight: 600">Your QR code is ready</div>
      <button class="more" id="more" type="button">See more designs</button>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="dist/qr-signs.js"></script>
<script>
  const Q = window.CelebrareQrSigns;
  const form = document.getElementById('f');
  const values = () => Object.fromEntries(new FormData(form));

  async function refreshPlain() {
    const ctx = await Q.createSignContext({ ...values(), assetsUrl: 'assets/' });
    document.getElementById('plainQr').src = ctx.data.qr;
  }
  form.addEventListener('input', refreshPlain);
  refreshPlain();

  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.style.display = 'block';
    clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = 'none'), 5000);
  }

  document.getElementById('more').addEventListener('click', () => {
    Q.openSignPicker({
      ...values(),
      assetsUrl: 'assets/', // the folder that holds fonts/ and images/
    });
  });
</script>
</body>
</html>
